name: Build Windows Portable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build portable exe (embed WebView2 bootstrap)
        run: wails build -clean -platform windows/amd64 -webview2 embed

      - name: Get short SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Delete existing release tag
        run: |
          git push origin :refs/tags/latest-build 2>$null
          exit 0
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Aether 直角版 (便携)"
          body: |
            ✅ 直角界面 · 透明背景Logo · Windows 便携版
            📦 下载 Aether.exe 直接双击运行，无需安装
            🔨 构建: ${{ steps.sha.outputs.sha }}
          files: build/bin/Aether.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
